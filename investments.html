<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KRNK2W5VPX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KRNK2W5VPX');
    </script>
    <title>Investimentos - Trilha Comigo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <script src="analytics.js"></script>
    <script src="https://cdn.pluggy.ai/pluggy-connect/v2/pluggy-connect.js"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-inter">

    <!-- App View Container (Layout Injected by layout.js) -->
    <div id="app-view" class="hidden">

        <!-- Main Content Area -->
        <main class="p-6 md:p-10 max-w-7xl mx-auto space-y-8">

            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Investimentos</h1>
                    <p class="text-gray-500 dark:text-gray-400">Acompanhe a evolução do seu patrimônio.</p>
                </div>
                <button id="add-investment-btn"
                    class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-lg shadow-indigo-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Novo Ativo
                </button>
            </div>

            <section id="investments-view">
                <div id="investment-summary" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <!-- Cards will be injected by app.js -->
                    <div
                        class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 animate-pulse h-32">
                    </div>
                    <div
                        class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 animate-pulse h-32">
                    </div>
                    <div
                        class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 animate-pulse h-32">
                    </div>
                </div>

                <div
                    class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-100 dark:border-gray-700">
                        <h3 class="text-lg font-bold text-gray-900 dark:text-white">Minha Carteira</h3>
                    </div>
                    <div id="investment-list" class="divide-y divide-gray-100 dark:divide-gray-700">
                        <p class="text-center text-gray-500 py-12">Carregando seus investimentos...</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal para Adicionar/Editar Ativo de Investimento -->
    <div id="investment-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] hidden transition-all">
        <div
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-md m-4 transform transition-all scale-100">
            <h3 id="investment-modal-title" class="text-xl font-bold mb-6 text-gray-900 dark:text-white">Novo Ativo</h3>
            <form id="investment-form">
                <input type="hidden" id="investment-id">
                <div class="space-y-5">
                    <div>
                        <label for="asset-name"
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome do
                            Ativo</label>
                        <input type="text" id="asset-name" placeholder="Ex: PETR4, Tesouro Direto..." required
                            class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                    </div>
                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label for="asset-quantity"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Quantidade</label>
                            <input type="number" id="asset-quantity" step="any" min="0" required
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                        </div>
                        <div>
                            <label for="asset-price"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Preço Médio
                                (R$)</label>
                            <input type="number" id="asset-price" step="0.01" min="0" required
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                        </div>
                    </div>
                    <div>
                        <label for="current-asset-price"
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Preço Atual
                            (R$)</label>
                        <input type="number" id="current-asset-price" step="0.01" min="0" required
                            class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                        <p class="text-xs text-gray-500 mt-1">Atualize periodicamente para ver a rentabilidade real.</p>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" id="cancel-investment-btn"
                        class="px-5 py-2.5 text-gray-600 dark:text-gray-300 font-medium hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancelar</button>
                    <button type="submit"
                        class="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-500/30">Salvar
                        Ativo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Transaction Modal (Compatibility for global button) -->
    <div id="transaction-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] hidden transition-all">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-md m-4">
            <h3 class="text-xl font-bold mb-4">Nova Transação</h3>
            <form id="transaction-form" onsubmit="event.preventDefault(); return false;">
                <p class="text-gray-500 mb-4">Use a página de Transações para gerenciar registros completos.</p>
                <button type="button" onclick="document.getElementById('transaction-modal').classList.add('hidden')"
                    class="px-4 py-2 bg-gray-200 rounded-lg">Fechar</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="layout.js"></script>
    <script src="premium.js" type="module"></script>
    <script src="app.js" type="module"></script>

</body>

</html>
