<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KRNK2W5VPX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KRNK2W5VPX');
    </script>
    <title>Orçamentos - Trilha Comigo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <script src="analytics.js"></script>
    <script src="https://cdn.pluggy.ai/pluggy-connect/v2/pluggy-connect.js"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-inter">

    <!-- App View Container (Layout Injected by layout.js) -->
    <div id="app-view" class="hidden">

        <!-- Main Content Area -->
        <main class="p-6 md:p-10 max-w-7xl mx-auto space-y-8">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Orçamentos</h1>
                    <p class="text-gray-500 dark:text-gray-400">Defina limites de gastos e acompanhe sua economia.</p>
                </div>

                <button id="add-budget-btn"
                    class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-lg shadow-indigo-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Novo Orçamento
                </button>
            </div>

            <!-- Budgets List -->
            <section id="budgets-view" class="space-y-6">
                <!-- Empty State (Hidden by default, shown via JS if empty) -->
                <div id="empty-state" class="hidden text-center py-12">
                    <div
                        class="bg-indigo-50 dark:bg-indigo-900/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                            </path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-1">Nenhum orçamento definido</h3>
                    <p class="text-gray-500 dark:text-gray-400">Crie orçamentos para controlar seus gastos por
                        categoria.</p>
                </div>

                <div id="budget-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Budgets will be inserted here by app.js -->
                </div>
            </section>

        </main>
    </div>

    <!-- Modal para Adicionar/Editar Orçamento -->
    <div id="budget-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] hidden transition-all">
        <div
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-md m-4 transform transition-all scale-100">
            <h3 id="budget-modal-title" class="text-xl font-bold mb-6 text-gray-900 dark:text-white">Gerenciar Orçamento
            </h3>
            <form id="budget-form">
                <div class="mb-5">
                    <label for="budget-category"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categoria de
                        Despesa</label>
                    <select id="budget-category" required
                        class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <!-- Opções de categoria de despesa serão preenchidas via JS -->
                    </select>
                </div>
                <div class="mb-6">
                    <label for="budget-limit"
                        class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Limite Mensal</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">R$</span>
                        <input type="number" id="budget-limit" step="0.01" min="0" required
                            class="w-full pl-10 pr-4 py-3 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                            placeholder="Ex: 500,00">
                    </div>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" id="cancel-budget-btn"
                        class="px-5 py-2.5 text-gray-600 dark:text-gray-300 font-medium hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancelar</button>
                    <button type="submit"
                        class="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-500/30">Salvar
                        Orçamento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Transaction Modal (Compatibility for global button) -->
    <div id="transaction-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] hidden transition-all">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-md m-4">
            <h3 class="text-xl font-bold mb-4">Nova Transação</h3>
            <form id="transaction-form" onsubmit="event.preventDefault(); return false;">
                <p class="text-gray-500 mb-4">Use a página de Transações para gerenciar registros completos.</p>
                <button type="button" onclick="document.getElementById('transaction-modal').classList.add('hidden')"
                    class="px-4 py-2 bg-gray-200 rounded-lg">Fechar</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="layout.js"></script>
    <script src="premium.js" type="module"></script>
    <script src="app.js" type="module"></script>

</body>

</html>
