<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KRNK2W5VPX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KRNK2W5VPX');
    </script>
    <title>Tarefas - Trilha Comigo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <script src="analytics.js"></script>
    <script src="https://cdn.pluggy.ai/pluggy-connect/v2/pluggy-connect.js"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-inter">

    <!-- App View Container (Layout Injected by layout.js) -->
    <div id="app-view" class="hidden">

        <!-- Main Content Area -->
        <main class="p-6 md:p-10 max-w-7xl mx-auto space-y-8">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Tarefas</h1>
                    <p class="text-gray-500 dark:text-gray-400">Organize suas atividades e acompanhe o progresso.</p>
                </div>
                <button id="add-task-btn"
                    class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-lg shadow-indigo-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Nova Tarefa
                </button>
            </div>

            <section id="tasks-view" class="space-y-6">

                <div
                    class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                            <thead class="bg-gray-50 dark:bg-gray-800/50">
                                <tr>
                                    <th scope="col"
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Título</th>
                                    <th scope="col"
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Responsável</th>
                                    <th scope="col"
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Prazo</th>
                                    <th scope="col"
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Prioridade</th>
                                    <th scope="col"
                                        class="px-6 py-4 text-left text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Status</th>
                                    <th scope="col" class="relative px-6 py-4"><span class="sr-only">Ações</span></th>
                                </tr>
                            </thead>
                            <tbody id="task-list"
                                class="bg-white dark:bg-gray-800 divide-y divide-gray-100 dark:divide-gray-700">
                                <!-- As tarefas serão inseridas aqui -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Empty State (Hidden by default, shown via JS if needed) -->
                <div id="tasks-empty-state" class="hidden text-center py-12">
                    <div
                        class="bg-indigo-50 dark:bg-indigo-900/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4">
                            </path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-1">Tudo organizado!</h3>
                    <p class="text-gray-500 dark:text-gray-400">Você não tem tarefas pendentes no momento.</p>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal para Adicionar/Editar Tarefa -->
    <div id="task-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] hidden transition-all">
        <div
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-lg m-4 transform transition-all scale-100">
            <h3 id="task-modal-title" class="text-xl font-bold mb-6 text-gray-900 dark:text-white">Nova Tarefa</h3>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="space-y-5">
                    <div>
                        <label for="task-title"
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Título</label>
                        <input type="text" id="task-title" required
                            class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="task-responsible"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Responsável</label>
                            <input type="text" id="task-responsible"
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                        </div>
                        <div>
                            <label for="task-due-date"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Prazo</label>
                            <input type="date" id="task-due-date"
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label for="task-priority"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Prioridade</label>
                            <select id="task-priority"
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                                <option>Normal</option>
                                <option>Urgente</option>
                                <option>Baixa</option>
                            </select>
                        </div>
                        <div>
                            <label for="task-status"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                            <select id="task-status"
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                                <option>Pendente</option>
                                <option>Em Andamento</option>
                                <option>Concluída</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" id="cancel-task-btn"
                        class="px-5 py-2.5 text-gray-600 dark:text-gray-300 font-medium hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancelar</button>
                    <button type="submit"
                        class="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-500/30">Salvar
                        Tarefa</button>
                </div>
            </form>
        </div>
    </div>


    <!-- Transaction Modal (Compatibility for global button) -->
    <div id="transaction-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] hidden transition-all">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-md m-4">
            <h3 class="text-xl font-bold mb-4">Nova Transação</h3>
            <form id="transaction-form" onsubmit="event.preventDefault(); return false;">
                <p class="text-gray-500 mb-4">Use a página de Transações para gerenciar registros completos.</p>
                <button type="button" onclick="document.getElementById('transaction-modal').classList.add('hidden')"
                    class="px-4 py-2 bg-gray-200 rounded-lg">Fechar</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="layout.js"></script>
    <script src="premium.js" type="module"></script>
    <script src="app.js" type="module"></script>

</body>

</html>
