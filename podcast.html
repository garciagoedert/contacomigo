<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrilhaCast - O Podcast de Economia do Trilha Comigo</title>
    <meta name="description"
        content="Ouça o TrilhaCast, o podcast que descomplica a economia e seus investimentos. Disponível no Spotify, Apple Podcasts e YouTube.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://trilhacomigo.br/podcast.html">
    <meta property="og:title" content="TrilhaCast - Economia Descomplicada">
    <meta property="og:description"
        content="Ouça o TrilhaCast, o podcast que descomplica a economia e seus investimentos.">
    <meta property="og:image" content="https://trilhacomigo.br/imgs/14.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KRNK2W5VPX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KRNK2W5VPX');
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300&family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <script src="analytics.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        h1,
        h2,
        h3,
        .serif-font {
            font-family: 'Inter', sans-serif;
        }

        .news-headline {
            font-family: 'Merriweather', serif;
        }

        .gradient-animate {
            background: linear-gradient(135deg, #0f172a 0%, #312e81 100%);
        }
    </style>
</head>

<body class="text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-slate-900 flex flex-col min-h-screen">

    <!-- Top Bar (Date + Trending) -->
    <div class="bg-slate-900 text-white text-xs py-2 border-b border-gray-800">
        <div class="container mx-auto px-4 md:px-6 flex justify-between items-center">
            <div id="current-date" class="font-medium opacity-80 hidden md:block"></div>
            <div class="flex gap-4 items-center">
                <span class="text-yellow-400 font-bold text-[10px] md:text-xs">MERCADO AGORA:</span>
                <div id="market-ticker" class="text-[10px] md:text-xs font-medium flex items-center gap-4">
                    <span class="animate-pulse">Carregando cotações...</span>
                </div>
            </div>
            <div class="hidden md:flex gap-3">
                <a href="#" class="hover:text-yellow-400 transition-colors">Newsletter</a>
                <a href="podcast.html" class="text-yellow-400 font-bold hover:underline transition-colors">Podcast</a>
            </div>
        </div>
    </div>

    <!-- Header / Navbar -->
    <header
        class="bg-white dark:bg-slate-900 shadow-sm sticky top-0 z-50 border-b border-gray-200 dark:border-gray-800">
        <div class="container mx-auto px-4 md:px-6">
            <div class="flex justify-between items-center h-20">
                <!-- Logo Zone -->
                <div class="flex items-center gap-6">
                    <a href="index.html" class="flex flex-col">
                        <span
                            class="text-2xl font-black tracking-tighter text-slate-900 dark:text-white leading-none">TRILHA<span
                                class="text-[var(--cor-principal)]">CAST</span></span>
                        <span class="text-[10px] tracking-[0.2em] text-gray-400 uppercase font-semibold">Audio
                            Experience</span>
                    </a>

                    <!-- Desktop Nav -->
                    <nav
                        class="hidden lg:flex items-center space-x-6 ml-8 text-sm font-semibold border-l border-gray-200 dark:border-gray-700 pl-8">
                        <a href="index.html"
                            class="text-slate-900 dark:text-gray-200 hover:text-[var(--cor-principal)]">Início</a>
                        <a href="artigos.html"
                            class="text-slate-900 dark:text-gray-200 hover:text-[var(--cor-principal)]">Notícias</a>
                        <a href="podcast.html"
                            class="text-[var(--cor-principal)] hover:text-[var(--cor-principal)]">Episódios</a>
                    </nav>
                </div>

                <!-- CTA Zone -->
                <div class="flex items-center gap-4">
                    <a href="login/index.html"
                        class="hidden md:block px-5 py-2.5 bg-[var(--cor-principal)] text-white font-bold rounded-full hover:opacity-90 transition-colors shadow-lg shadow-pink-500/20 text-sm">
                        Assinar App
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">

        <!-- Hero Section: Featured Episode -->
        <section class="bg-slate-900 text-white py-16 lg:py-24 relative overflow-hidden" id="hero-section">
            <div
                class="absolute inset-0 bg-[url('imgs/podcast-bg.jpg')] bg-cover opacity-20 bg-center mix-blend-overlay">
            </div>
            <!-- Gradient Overlay -->
            <div class="absolute inset-0 bg-gradient-to-r from-slate-900 via-slate-900/90 to-transparent"></div>

            <div class="container mx-auto px-4 md:px-6 relative z-10">
                <div class="flex flex-col lg:flex-row items-center gap-12" id="hero-content">
                    <!-- Loading State -->
                    <div class="w-full h-96 flex items-center justify-center">
                        <span class="animate-pulse text-xl font-bold text-gray-400">Carregando último episódio...</span>
                    </div>
                </div>
            </div>
        </section>



        <!-- Episodes Grid -->
        <section class="py-16 bg-white dark:bg-slate-900">
            <div class="container mx-auto px-4 md:px-6">
                <div class="flex items-center justify-between mb-12">
                    <h2
                        class="text-3xl font-black text-slate-900 dark:text-white border-l-4 border-[var(--cor-principal)] pl-4">
                        Últimos Episódios</h2>
                    <a href="#" class="text-[var(--cor-principal)] font-bold hover:underline">Ver todos →</a>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="episodes-grid">
                    <!-- Loading Skeleton -->
                    <div
                        class="animate-pulse bg-gray-200 h-96 rounded-2xl col-span-1 md:col-span-2 lg:col-span-3 text-center py-20 text-gray-400">
                        Carregando episódios...
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-slate-900 border-t border-gray-200 dark:border-gray-800 pt-16 pb-8">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8">
                <div class="flex items-center gap-2 mb-4 md:mb-0">
                    <img src="imgs/14.png" class="h-8 opacity-80" alt="Logo">
                    <span class="font-bold text-gray-900 dark:text-white">Trilha News</span>
                </div>
                <div class="flex gap-8 text-sm font-medium text-gray-500">
                    <a href="index.html" class="hover:text-[var(--cor-principal)]">Home</a>
                    <a href="artigos.html" class="hover:text-[var(--cor-principal)]">Notícias</a>
                    <a href="podcast.html" class="text-[var(--cor-principal)]">Podcast</a>
                </div>
            </div>
            <div class="text-center text-xs text-gray-400">
                &copy; 2026 Trilha Comigo. Todos os direitos reservados.
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Set Date
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('pt-BR', dateOptions).replace(/^\w/, c => c.toUpperCase());
    </script>
    <script src="market-ticker.js"></script>
    <script src="podcast-api.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const episodes = await fetchPodcastEpisodes(10);

            if (!episodes || episodes.length === 0) {
                document.getElementById('hero-content').innerHTML = '<div class="text-center w-full">Não foi possível carregar os episódios.</div>';
                return;
            }

            // 1. Featured Episode (Latest)
            const latest = episodes[0];
            const heroHtml = `
                    <div class="lg:w-1/2 space-y-6">
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-pink-500/20 text-pink-400 text-xs font-bold uppercase tracking-wider border border-pink-500/30">
                            <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
                            Episódio Mais Recente
                        </div>
                        <h1 class="text-3xl md:text-5xl font-black leading-tight news-headline">${latest.title}</h1>
                        <div class="text-lg text-gray-300 max-w-xl leading-relaxed line-clamp-3 text-sm">${latest.description}</div>
                        

                        <audio controls class="w-full mt-4 rounded-lg bg-slate-800">
                             <source src="${latest.audio}" type="audio/mpeg">
                             Seu navegador não suporta áudio.
                        </audio>
                    </div>

                    <div class="lg:w-1/2 flex justify-center lg:justify-end">
                        <div class="relative w-80 h-80 md:w-96 md:h-96">
                            <div class="absolute inset-0 bg-pink-500 rounded-3xl blur-3xl opacity-20 animate-pulse"></div>
                            <img src="${latest.thumbnail}" alt="${latest.title}" class="relative z-10 w-full h-full object-cover rounded-3xl shadow-2xl border-4 border-slate-800/50 bg-slate-800 p-4">
                        </div>
                    </div>
             `;
            document.getElementById('hero-content').innerHTML = heroHtml;

            // 2. Episodes Grid
            const grid = document.getElementById('episodes-grid');
            grid.innerHTML = '';

            // Skip first one
            episodes.slice(1).forEach(ep => {
                const date = ep.pubDate.toLocaleDateString('pt-BR');
                const html = `
                    <div class="group bg-slate-50 dark:bg-slate-800 rounded-2xl overflow-hidden border border-gray-100 dark:border-gray-700 hover:shadow-xl transition-all hover:-translate-y-1">
                        <div class="relative h-48 overflow-hidden">
                            <img src="${ep.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80" alt="${ep.title}">
                            <div class="absolute inset-0 bg-slate-900/40 group-hover:bg-slate-900/20 transition-all flex items-center justify-center">
                                <a href="${ep.link}" target="_blank" class="bg-white/90 text-slate-900 p-4 rounded-full shadow-lg hover:scale-110 transition-transform">
                                    <svg class="w-8 h-8 pl-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </a>
                            </div>
                        </div>
                        <div class="p-6">
                            <div class="flex items-center gap-3 mb-3 text-xs text-gray-500 font-bold uppercase tracking-wide">
                                <span class="text-[var(--cor-principal)]">TrilhaCast</span>
                                <span>•</span>
                                <span>${date}</span>
                            </div>
                            <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3 leading-tight group-hover:text-[var(--cor-principal)] transition-colors line-clamp-2">${ep.title}</h3>
                            <a href="${ep.link}" target="_blank" class="w-full block text-center py-2 border border-slate-200 dark:border-gray-600 rounded-lg text-sm font-bold text-slate-700 dark:text-gray-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                                Ouvir Episódio
                            </a>
                        </div>
                    </div>
                 `;
                grid.innerHTML += html;
            });

        });
    </script>
</body>

</html>
