<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Admin - Trilha Comigo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Simple WYSIWYG Editor (Quill) -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200">
    <!-- Navbar -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-6">
                    <span
                        class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                        Admin Newsletter
                    </span>
                    <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 transition-colors">Voltar para
                        Dashboard</a>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="admin-email" class="text-sm text-gray-500">...</span>
                    <button id="logout-btn" class="text-sm text-red-600 hover:text-red-800">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Tabs -->
        <div class="border-b border-gray-200 dark:border-gray-700 mb-8">
            <nav class="-mb-px flex space-x-8" aria-label="Tabs">
                <button id="tab-compose-btn"
                    class="border-blue-500 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors"
                    aria-current="page">
                    Nova Campanha
                </button>
                <button id="tab-history-btn"
                    class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                    Histórico
                </button>
                <button id="tab-subscribers-btn"
                    class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                    Inscritos & Importação
                </button>
            </nav>
        </div>

        <!-- TAB: COMPOSE -->
        <div id="tab-compose" class="tab-content block">
            <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-medium text-gray-900 dark:text-white">Escrever Newsletter</h2>
                    <button id="save-draft-btn" class="text-sm text-gray-500 hover:text-gray-900 underline">Salvar
                        Rascunho</button>
                </div>

                <div class="space-y-6">
                    <!-- Subject -->
                    <div>
                        <label for="email-subject"
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300">Assunto do Email</label>
                        <div class="mt-1">
                            <input type="text" name="email-subject" id="email-subject"
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 bg-gray-50 dark:bg-gray-700 dark:border-gray-600"
                                placeholder="Ex: Dicas de Investimento para 2025">
                        </div>
                    </div>

                    <!-- Editor -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Conteúdo</label>
                        <div id="editor-container" class="h-96 bg-white text-black text-base"></div>
                    </div>

                    <!-- Actions -->
                    <div
                        class="flex flex-col md:flex-row gap-4 justify-between border-t border-gray-200 dark:border-gray-700 pt-6">
                        <!-- Test Section -->
                        <div class="flex flex-col md:flex-row gap-2 items-start md:items-center">
                            <input type="email" id="test-email-input" placeholder="Email de teste"
                                class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-64 sm:text-sm border-gray-300 rounded-md p-2 bg-gray-50 dark:bg-gray-700">
                            <button id="send-test-btn"
                                class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                                Enviar Teste
                            </button>
                        </div>

                        <!-- Send All Section -->
                        <button id="send-all-btn"
                            class="inline-flex items-center px-6 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            Enviar para Todos
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB: HISTORY -->
        <div id="tab-history" class="tab-content hidden">
            <div class="bg-white dark:bg-gray-800 shadow rounded-lg overflow-hidden">
                <div
                    class="px-4 py-5 border-b border-gray-200 dark:border-gray-700 sm:px-6 flex justify-between items-center flex-wrap gap-4">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white">Envios Recentes</h3>

                    <div class="flex items-center gap-2">
                        <div class="relative">
                            <input type="file" id="csv-posts-input" accept=".csv" class="hidden" />
                            <label for="csv-posts-input"
                                class="cursor-pointer inline-flex items-center px-3 py-1.5 border border-gray-300 shadow-sm text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-50 focus:outline-none">
                                📤 Importar CSV
                            </label>
                        </div>
                        <button id="refresh-history-btn"
                            class="text-sm text-blue-600 hover:text-blue-800">Atualizar</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
                        <thead class="bg-gray-50 dark:bg-gray-700">
                            <tr>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    Assunto</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    Data Envio</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    Enviados</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    Status</th>
                                <th scope="col"
                                    class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                                    Ações</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body"
                            class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                            <!-- Rows injected by JS via Firestore -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB: SUBSCRIBERS -->
        <div id="tab-subscribers" class="tab-content hidden">
            <!-- Stats -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white dark:bg-gray-800 overflow-hidden shadow rounded-lg p-5">
                    <dt class="text-sm font-medium text-gray-500 truncate">Total de Inscritos</dt>
                    <dd class="mt-1 text-3xl font-semibold text-gray-900 dark:text-white" id="total-subscribers-count">
                        ...</dd>
                </div>
                <div class="bg-white dark:bg-gray-800 overflow-hidden shadow rounded-lg p-5">
                    <dt class="text-sm font-medium text-gray-500 truncate">Importação em Massa</dt>
                    <div class="mt-4 flex gap-2">
                        <input type="file" id="csv-file-input" accept=".csv" class="block w-full text-sm text-gray-500
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-full file:border-0
                            file:text-sm file:font-semibold
                            file:bg-blue-50 file:text-blue-700
                            hover:file:bg-blue-100
                          " />
                        <button id="import-csv-btn"
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
                            Importar
                        </button>
                    </div>
                    <p class="text-xs text-gray-400 mt-2">Formato: Uma coluna de emails ou CSV padrão (header: email).
                    </p>
                </div>
            </div>

            <div class="bg-white dark:bg-gray-800 shadow rounded-lg overflow-hidden">
                <div class="px-4 py-5 border-b border-gray-200 dark:border-gray-700 sm:px-6">
                    <h3 class="text-lg leading-6 font-medium text-gray-900 dark:text-white">Lista de Emails</h3>
                </div>
                <ul id="subscribers-list"
                    class="divide-y divide-gray-200 dark:divide-gray-700 max-h-96 overflow-y-auto">
                    <!-- List items -->
                </ul>
            </div>
        </div>

        <!-- Status Message (Global) -->
        <div id="status-message" class="hidden rounded-md p-4 mb-8 fixed bottom-4 right-4 max-w-sm shadow-lg z-50">
            <div class="flex">
                <div class="ml-3">
                    <p class="text-sm font-medium" id="status-text"></p>
                </div>
            </div>
        </div>

    </main>

    <!-- JS Libs -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script type="module" src="newsletter.js"></script>
</body>

</html>
