name: Gerar Notícia Diária (Trilha News)

on:
  schedule:
    # 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00 em Brasília (UTC-3)
    - cron: '0 11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria (auto segue a rotação por horário)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - Economia
          - Investimentos
          - Tecnologia
          - Política
          - Carreira
          - Games
          - Esportes

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish daily post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_CATEGORY: ${{ inputs.category || 'auto' }}
        run: node scripts/generate-daily-post.mjs
