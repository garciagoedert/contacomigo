<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KRNK2W5VPX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-KRNK2W5VPX');
    </script>
    <title>Transações - Trilha Comigo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <script src="analytics.js"></script>
    <script src="https://cdn.pluggy.ai/pluggy-connect/v2/pluggy-connect.js"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-inter">

    <!-- App View Container (Layout Injected by layout.js) -->
    <div id="app-view" class="hidden">

        <!-- Main Content Area -->
        <main class="p-6 md:p-10 max-w-7xl mx-auto space-y-8">

            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Transações</h1>
                    <p class="text-gray-500 dark:text-gray-400">Gerencie suas receitas e despesas.</p>
                </div>
                <button id="add-transaction-btn"
                    class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium transition-all shadow-lg shadow-indigo-500/20">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                    Nova Transação
                </button>
            </div>

            <!-- Filters Toolbar (Placeholder for future functionality) -->
            <div
                class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex flex-col md:flex-row gap-4 items-center">
                <div class="relative w-full md:w-64">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" placeholder="Buscar..."
                        class="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                    <select
                        class="px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option>Todas Categorias</option>
                        <option>Alimentação</option>
                        <option>Moradia</option>
                    </select>
                    <input type="date"
                        class="px-4 py-2 bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
            </div>

            <section id="transactions-view">
                <div
                    class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 overflow-hidden">
                    <div id="transaction-list" class="divide-y divide-gray-100 dark:divide-gray-700">
                        <p id="no-transactions" class="text-center text-gray-500 dark:text-gray-400 py-12">Carregando
                            transações...</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Modal para Adicionar/Editar Transação -->
    <div id="transaction-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-[60] hidden transition-all">
        <div id="modal-content"
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-6 w-full max-w-md m-4 transform transition-all scale-100">
            <h3 id="modal-title" class="text-xl font-bold mb-6 text-gray-900 dark:text-white">Nova Transação</h3>
            <form id="transaction-form">
                <input type="hidden" id="transaction-id">

                <div class="space-y-5">
                    <div>
                        <label for="description"
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Descrição</label>
                        <input type="text" id="description" required
                            class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                    </div>

                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <label for="amount"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Valor
                                (R$)</label>
                            <input type="number" id="amount" step="0.01" min="0" required
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700"
                                placeholder="0,00">
                        </div>
                        <div>
                            <label for="date"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Data</label>
                            <input type="date" id="date" required
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-5">
                        <div>
                            <span class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Tipo</span>
                            <div class="flex gap-4">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="type" value="income"
                                        class="form-radio text-green-500 focus:ring-green-500 h-4 w-4" checked>
                                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Receita</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="type" value="expense"
                                        class="form-radio text-red-500 focus:ring-red-500 h-4 w-4">
                                    <span class="ml-2 text-sm text-gray-700 dark:text-gray-300">Despesa</span>
                                </label>
                            </div>
                        </div>
                        <div>
                            <label for="category"
                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Categoria</label>
                            <select id="category" required
                                class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700">
                                <option value="alimentacao">Alimentação</option>
                                <option value="moradia">Moradia</option>
                                <option value="transporte">Transporte</option>
                                <option value="lazer">Lazer</option>
                                <option value="saude">Saúde</option>
                                <option value="salario">Salário</option>
                                <option value="investimentos">Investimentos</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-gray-100 dark:border-gray-700">
                        <label class="flex items-center cursor-pointer mb-3">
                            <input type="checkbox" id="is-investment"
                                class="form-checkbox rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                            <span class="ml-2 text-sm text-gray-600 dark:text-gray-400">É um investimento ou
                                resgate?</span>
                        </label>

                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="is-recurring"
                                class="form-checkbox rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
                            <span class="ml-2 text-sm text-gray-600 dark:text-gray-400">Repetir mensalmente?</span>
                        </label>
                    </div>

                    <div id="recurrence-details" class="hidden pl-6 border-l-2 border-indigo-100 dark:border-gray-700">
                        <label for="recurrence-frequency"
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Frequência</label>
                        <select id="recurrence-frequency"
                            class="w-full px-4 py-2 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50 dark:bg-gray-700 text-sm">
                            <option value="monthly">Mensal</option>
                            <option value="weekly">Semanal</option>
                            <option value="yearly">Anual</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" id="cancel-btn"
                        class="px-5 py-2.5 text-gray-600 dark:text-gray-300 font-medium hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancelar</button>
                    <button type="submit"
                        class="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-500/30">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="layout.js"></script>
    <script src="premium.js" type="module"></script>
    <script src="app.js" type="module"></script>

</body>

</html>
